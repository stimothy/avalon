[project]
name = "avalon-development"
version = "0.0.0"
description = "Development tools for the Avalon repo. This project builds no package."
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9; python_version >= '3.10'",
    "pytest>=8.4,<9; python_version < '3.10'",
    "coverage>=7.17; python_version >= '3.11'",
    "coverage>=7.10; python_version == '3.10'",
    "coverage>=7.10,<7.11; python_version < '3.10'",
    "ruff",
    "mypy; python_version >= '3.10'",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers --strict-config -ra"
norecursedirs = ["_bmad", "_bmad-output", "temporary-plans", ".claude", ".venv", "node_modules"]

[tool.coverage.run]
source = ["plugin/script", "devtools"]
parallel = true
data_file = ".coverage/data"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["_bmad", "_bmad-output", "temporary-plans", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["suite_guard", "devtools", "fakes"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tests", "devtools"]
