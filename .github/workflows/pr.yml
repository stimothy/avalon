name: pr

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOW_PRE_1_MAJOR: ${{ vars.ALLOW_PRE_1_MAJOR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python -m devtools.gates pr-labels --pr ${{ github.event.pull_request.number }}
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python -m devtools.gates pull-request --title "$PR_TITLE" --body "$PR_BODY"
      - run: uv run python -m devtools.release dry-run --pr ${{ github.event.pull_request.number }}
